name: Validate bilingual website
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies and Chromium
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test database security and bilingual flows in emulators
        run: npx -y firebase-tools@latest emulators:exec --only firestore,auth --project demo-pawpark-2027 --config emulators.json 'npm run test:rules && npm run test:csv && npm test'
      - name: Check Canva visual geometry on phone, tablet and desktop
        run: node tests/visual-layout.cjs
      - name: Save public-page visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pawpark-canva-public-screenshots
          path: |
            test-results/pawpark-*.png
            index.html
            site-canva-faithful.css
            site-fixes.css
            site-photos.css
            assets/
          retention-days: 7
          if-no-files-found: ignore
