name: Align original PawPark image filenames
on:
  push:
    paths:
      - .github/workflows/align-photo-names.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Correct hero and booking-photo labels using existing uploaded originals
        run: |
          set -euo pipefail
          test -s assets/hero-pomeranian.jpg
          test -s assets/booking-collage.jpg
          mv assets/hero-pomeranian.jpg assets/photo-original-swap.tmp
          mv assets/booking-collage.jpg assets/hero-pomeranian.jpg
          mv assets/photo-original-swap.tmp assets/booking-collage.jpg
          file assets/hero-pomeranian.jpg assets/booking-collage.jpg
      - name: Commit corrected assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hero-pomeranian.jpg assets/booking-collage.jpg
          git commit -m "Correct mapping: Pomeranian hero and family booking collage"
          git push origin HEAD:main
