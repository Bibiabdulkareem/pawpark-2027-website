<!doctype html><html lang="en" dir="ltr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PawPark 2027 — Admin Demo</title><style>
:root{--blue:#003e8e;--cream:#f6f6e9;--beige:#eddeae;--yellow:#f2df68}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:#07336c;font:15px/1.5 Arial,Tahoma,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{background:var(--blue);color:white;padding:24px 20px}main{max-width:1060px;margin:auto;padding:27px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}.top h1{margin:0;font-size:clamp(23px,4vw,34px)}.btn{border:0;border-radius:10px;background:var(--beige);color:var(--blue);padding:10px 15px;font-weight:bold;text-decoration:none}.note{background:#fff0b2;color:#604000;padding:14px 17px;border:2px solid #edd57b;border-radius:12px;margin:25px 0;font-weight:650}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{background:white;border-radius:14px;padding:18px}.stat b{font-size:27px;display:block}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:24px 0}.controls input,.controls select{min-height:44px;padding:9px;border:1px solid #b4c5d1;border-radius:8px;background:white;color:var(--blue)}.controls input{flex:1;min-width:150px}.list{display:grid;gap:13px}.entry{background:white;border:1px solid #d7d8d6;border-radius:15px;padding:18px}.entry-head{display:flex;justify-content:space-between;gap:12px;align-items:start;flex-wrap:wrap}.entry h3{margin:0;font-size:18px}.entry small{color:#5c6d7b}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0}.kv div{overflow-wrap:anywhere}.kv strong{display:block;color:#294e7d;font-size:12px}.badge{border-radius:18px;padding:5px 10px;background:#edf4ff;color:var(--blue);font-size:12px;font-weight:bold}.empty{padding:30px;background:#fff;text-align:center;border-radius:14px}.link{color:#fff;text-decoration:underline}.actions{display:flex;gap:10px;flex-wrap:wrap}footer{text-align:center;margin:30px;color:#586982}@media(max-width:620px){.stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.stat{padding:11px}.stat b{font-size:21px}.kv{grid-template-columns:1fr}}
</style></head><body>
<header><div class="top" style="max-width:1060px;margin:auto"><h1 data-en="PawPark · Admin Preview" data-ar="باو بارك · معاينة لوحة الإدارة"></h1><div class="actions"><button id="lang" class="btn">العربية</button><a class="link" href="index.html" data-en="← Visitor website" data-ar="← موقع الزوار"></a></div></div></header>
<main><div class="note" data-en="DEMO ONLY: This is not an authenticated admin system. Demo requests are saved only in this browser on this device. Other visitors cannot see your device's local data. DO NOT enter real customer data until secure backend and admin sign-in are configured." data-ar="تجربة فقط: هذه ليست لوحة إدارة محمية بتسجيل دخول. طلبات التجربة محفوظة داخل هذا المتصفح على نفس الجهاز فقط؛ زوار الأجهزة الأخرى لا يشوفون بيانات جهازك. لا تدخل بيانات عملاء حقيقية قبل إعداد قاعدة بيانات آمنة ودخول خاص للأدمن."></div>
<div class="stats"><div class="stat"><b id="total">0</b><span data-en="Demo requests" data-ar="طلبات تجريبية"></span></div><div class="stat"><b id="spaces">0</b><span data-en="Space requests" data-ar="طلبات المساحات"></span></div><div class="stat"><b id="pets">0</b><span data-en="Pet show requests" data-ar="طلبات عروض الحيوانات"></span></div></div>
<div class="controls"><input id="search" type="search" data-ph-en="Search name or phone" data-ph-ar="ابحث بالاسم أو الرقم"><select id="filter"><option value="all" data-en="All requests" data-ar="كل الطلبات"></option><option value="Space request" data-en="Space requests" data-ar="طلبات المساحة"></option><option value="Pet show" data-en="Pet show requests" data-ar="طلبات عروض الحيوانات"></option></select><button class="btn" id="download" type="button" data-en="Export demo CSV" data-ar="تنزيل CSV تجريبي"></button></div>
<div class="list" id="list" aria-live="polite"></div>
<footer data-en="This preview does not sync across devices, send emails, or replace the future secure admin dashboard." data-ar="هذه المعاينة لا تتزامن بين الأجهزة ولا ترسل إيميلات ولا تغني عن لوحة الإدارة الآمنة لاحقًا."></footer>
</main><script>
(()=>{"use strict";let lang="en";const $=id=>document.getElementById(id),val=id=>($(id).value||"").trim();function safe(){try{let d=JSON.parse(localStorage.getItem("pawpark_demo_requests")||"[]");return Array.isArray(d)?d:[]}catch(e){return []}}
function t(en,ar){return lang==="ar"?ar:en}function language(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").textContent=lang==="ar"?"English":"العربية";document.querySelectorAll("[data-en][data-ar]").forEach(x=>{x.textContent=x.dataset[lang]});$("search").placeholder=lang==="ar"?$("search").dataset.phAr:$("search").dataset.phEn;render()}
$("lang").addEventListener("click",()=>{lang=lang==="en"?"ar":"en";language()});$("filter").addEventListener("change",render);$("search").addEventListener("input",render);
function render(){let all=safe();$("total").textContent=all.length;$("spaces").textContent=all.filter(x=>x.type==="Space request").length;$("pets").textContent=all.filter(x=>x.type==="Pet show").length;let f=val("filter"),q=val("search").toLowerCase(),items=all.filter(x=>(f==="all"||x.type===f)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$("list").replaceChildren();if(!items.length){let p=document.createElement("div");p.className="empty";p.textContent=t("No demo requests on this device yet. Submit a test request on the visitor page and return here.","لا توجد طلبات تجريبية على هذا الجهاز. قدّم طلبًا تجريبيًا من صفحة الزوار وارجع هنا.");$("list").append(p);return}
for(let row of items){let card=document.createElement("article");card.className="entry",head=document.createElement("div");head.className="entry-head";let box=document.createElement("div"),h=document.createElement("h3");h.textContent=row.brand||row.owner||"(No name)";let small=document.createElement("small");small.textContent=(row.id||"")+" · "+(row.date?new Date(row.date).toLocaleString(lang==="ar"?"ar-KW":"en-GB"):"");box.append(h,small);let status=document.createElement("span");status.className="badge";status.textContent=t("DEMO ONLY","تجريبي فقط");head.append(box,status);card.append(head);let kv=document.createElement("div");kv.className="kv";for(let [k,v] of Object.entries(row)){if(["id","date"].includes(k)||v==null||typeof v==="object"||v==="")continue;let d=document.createElement("div"),label=document.createElement("strong");label.textContent=k.replace(/([A-Z])/g," $1");d.append(label,document.createTextNode(String(v)));kv.append(d)}card.append(kv);$("list").append(card)}
}
$("download").addEventListener("click",()=>{let data=safe();if(!data.length)return;let keys=["id","date","type","brand","contact","owner","phone","email","space","zone","custom","show","pet","species","breed","age","status"];let esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';let csv=[keys.join(","),...data.map(x=>keys.map(k=>esc(x[k])).join(","))].join("\r\n");let blob=new Blob(["\uFEFF",csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="pawpark-demo-requests.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1200)});
language()})();
</script></body></html>
