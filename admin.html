<!doctype html>
<html lang="en" dir="ltr"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#003e8e">
<title>PawPark — Admin</title>
<style>
:root{--blue:#003e8e;--cream:#f6f6e9;--beige:#eddeae;--yellow:#f2df68;--ink:#0b2b5d}
*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:clip}
body{background:var(--cream);color:var(--ink);font:15px/1.5 Arial,"Segoe UI",Tahoma,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{background:var(--blue);color:white;padding:18px 0}
.wrap{width:min(1080px,calc(100% - 30px));margin:auto}
.top{display:flex;gap:15px;align-items:center;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:clamp(21px,4vw,33px)}
a{color:inherit}a:hover{text-decoration:underline}
.nav-actions{display:flex;align-items:center;gap:11px}
.nav-actions a{font-size:13px}
.btn{background:var(--beige);border:0;border-radius:10px;color:var(--blue);padding:11px 14px;font-weight:800;text-decoration:none}
.btn.alt{background:var(--blue);color:white}
main{padding:25px 0 65px}
.note{padding:12px 14px;border-left:4px solid #d7b43d;background:#ffefb7;color:#5d4500;border-radius:6px;font-size:13px;margin:0 0 22px}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 12px}
.topline h2{margin:0;font-size:clamp(20px,4vw,29px)}
.topline small{color:#576a80}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border-radius:12px;padding:15px;border:1px solid #e3e1d5}
.stat strong{display:block;font-size:28px;line-height:1.2}
.stat span{display:block;font-size:13px;color:#455a75}
.filters{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:18px}
.filters input,.filters select{min-height:46px;background:white;border:1.5px solid #bcc7d4;border-radius:8px;padding:10px;min-width:0;color:var(--blue);font-size:15px}
.filters input{flex:1;min-width:180px}.filters select{min-width:140px}
.count{font-size:13px;color:#48627a;margin:0 0 13px}
.cards{display:grid;gap:15px;min-width:0}
.request{background:white;border-radius:15px;border:1px solid #d8dedc;padding:18px;min-width:0;box-shadow:0 2px 8px rgba(0,36,70,.04)}
.request-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;padding-bottom:13px;border-bottom:1px solid #e5e5de}
.request h3{margin:0;font-size:20px;color:var(--blue);overflow-wrap:anywhere}
.meta{font-size:12px;color:#60728b;margin:5px 0 0;overflow-wrap:anywhere}
.tag{border-radius:22px;padding:6px 11px;font-size:12px;font-weight:800;background:#e9f0ff;color:var(--blue);white-space:nowrap}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;padding:17px 0}
.field{min-width:0;overflow-wrap:anywhere}
.field span{color:#657589;font-size:12px;display:block;margin-bottom:4px}
.field b{font-size:15px;word-break:break-word}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin:3px 0 18px}
.actions .btn{font-size:13px;display:inline-flex;align-items:center}
.manage{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-top:1px solid #e5e5de;padding-top:15px}
.manage label{font-size:12px;font-weight:800;color:var(--blue)}
.manage select,.manage textarea{display:block;margin-top:6px;padding:8px 10px;background:#f9f9f5;border:1px solid #d3d8da;border-radius:7px;min-width:0;width:100%;color:var(--blue);font-size:14px}
.manage .status-wrap{min-width:180px;flex:0 1 200px}
.manage .notes-wrap{min-width:220px;flex:1}
.manage textarea{resize:vertical;height:55px}
.empty{background:white;border-radius:13px;padding:35px 20px;text-align:center;color:#596a7e}
.alert{color:#ac2828;padding:14px;background:white;border-radius:10px}
.bottom{margin-top:27px;font-size:12px;color:#587087}
@media(max-width:680px){.wrap{width:calc(100% - 24px)}.top h1{font-size:21px}.nav-actions{gap:7px}.nav-actions a{font-size:11px}.nav-actions .btn{padding:8px;font-size:12px}.stats{gap:6px}.stat{padding:12px 9px}.stat strong{font-size:23px}.stat span{font-size:10px}.filters input{min-width:130px}.filters select{flex:1;min-width:130px}.filters .btn{flex:1}.request{padding:14px}.request h3{font-size:18px}.fields{grid-template-columns:1fr 1fr;gap:12px}.field b{font-size:13px}.actions .btn{flex:1;justify-content:center}.manage{display:block}.manage .status-wrap,.manage .notes-wrap{display:block;margin-bottom:13px;width:100%}}
@media(max-width:350px){.fields{grid-template-columns:1fr}}

<body>
<header><div class="wrap top"><h1 data-en="PawPark · Request Inbox" data-ar="باو بارك · صندوق الطلبات"></h1>
<div class="nav-actions"><button class="btn" id="lang" type="button">العربية</button><a href="index.html" data-en="Visitor website" data-ar="موقع الزوار"></a></div>
</div></header>
<main class="wrap">
<section id="adminGate" class="request">
<p data-en="Sign in with your authorized PawPark Google account." data-ar="سجّل الدخول بحساب Google المعتمد لإدارة باو بارك."></p>
<button id="signIn" class="btn" type="button" data-en="Sign in with Google" data-ar="تسجيل الدخول باستخدام Google"></button>
<p id="authState" role="status"></p>
</section>
<button id="signOut" class="btn" type="button" hidden data-en="Sign out" data-ar="تسجيل الخروج"></button>
<p id="saveState" role="status"></p>
<section id="dashboard" hidden>
<p class="note" data-en="Protected PawPark inbox · Customer information is private. Changes are saved to the shared database. Sign out when finished." data-ar="صندوق باو بارك المحمي · معلومات العملاء خاصة. تُحفظ التغييرات في قاعدة البيانات المشتركة. سجّل الخروج بعد الانتهاء."></p>
<div class="topline"><h2 data-en="Incoming requests" data-ar="الطلبات الواردة"></h2><small data-en="Authorized administrators only" data-ar="للمسؤولين المعتمدين فقط"></small></div>
<section class="stats" aria-label="Summary"><div class="stat"><strong id="total">0</strong><span data-en="All applications" data-ar="جميع الطلبات"></span></div><div class="stat"><strong id="spaces">0</strong><span data-en="Space requests" data-ar="طلبات المساحات"></span></div><div class="stat"><strong id="pets">0</strong><span data-en="Pet show" data-ar="عروض الحيوانات"></span></div></section>
<div class="filters">
<input id="search" type="search" data-en-placeholder="Search name or phone" data-ar-placeholder="ابحث بالاسم أو الرقم" aria-label="Search name or phone">
<select id="filter" aria-label="Filter by request type"><option value="all" data-en="All requests" data-ar="كل الطلبات"></option><option value="Space request" data-en="Space requests" data-ar="طلبات المساحات"></option><option value="Pet show" data-en="Pet show requests" data-ar="طلبات عروض الحيوانات"></option></select>
<select id="contractFilter" aria-label="Contract progress"><option value="all" data-en="All contract stages" data-ar="كل مراحل العقود"></option><option value="Not started" data-en="Contract not started" data-ar="العقد لم يبدأ"></option><option value="Preparing" data-en="Preparing contract" data-ar="تجهيز العقد"></option><option value="Sent" data-en="Contract sent" data-ar="تم إرسال العقد"></option><option value="Signed" data-en="Contract signed" data-ar="تم توقيع العقد"></option></select>
<button id="download" class="btn" type="button" data-en="Export CSV" data-ar="تصدير CSV"></button>
</div>
<div id="statusOverview" class="status-overview" aria-label="Application status filters"></div>
<p id="count" class="count" aria-live="polite"></p>
<div id="list" class="cards" aria-live="polite"></div>
<p class="bottom" data-en="Applications are shared across devices for authorized administrators. Email and WhatsApp replies are drafts; send them in the selected app." data-ar="تظهر الطلبات للمسؤولين المعتمدين عبر الأجهزة. الردود بالإيميل والواتساب مسودات تُرسل من التطبيق المختار."></p>
</section>
</main>
<script type="module">
import { authorizedAdmin, signInAdmin, signOutAdmin, watchAdmin, watchApplications, updateApplication } from "./firebase-backend.js";
(function(){"use strict";
var lang="en";
function $(id){return document.getElementById(id)}
function tr(en,ar){return lang==="ar"?ar:en}
var rowsCache=[],serverRows=[],pending=new Map(),queues=new Map(),revision=0,unsubscribe=null,activeAdmin=false;
function load(){return rowsCache}
function rebuild(){rowsCache=serverRows.map(row=>Object.assign({},row,pending.get(row.id)?.values||{}))}
function saveNotice(text){$("saveState").textContent=text}
function refreshRows(rows){serverRows=rows;rebuild();if(!document.activeElement?.closest(".request textarea"))render()}
function put(node,tag,cls,value){var el=document.createElement(tag);if(cls)el.className=cls;if(value!==undefined&&value!==null)el.textContent=String(value);node.appendChild(el);return el}
function labels(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("lang").textContent=lang==="ar"?"English":"العربية";document.querySelectorAll("[data-en][data-ar]").forEach(function(e){e.textContent=e.getAttribute("data-"+lang)});$("search").placeholder=$("search").getAttribute("data-"+lang+"-placeholder");document.title=tr("PawPark — Request Inbox","باو بارك — صندوق الطلبات")}
function itemField(parent,en,ar,value){if(value===undefined||value===null||value==="")return;var wrap=put(parent,"div","field");put(wrap,"span","",tr(en,ar));put(wrap,"b","",value)}
function phoneHref(v){return "tel:"+String(v||"").replace(/[^+0-9]/g,"")}

var states=["New","Under Review","Approved","Rejected","Waitlisted"];
var statesAr=["جديد","قيد المراجعة","موافق عليه","مرفوض","قائمة الانتظار"];
var contractStates=["Not started","Preparing","Sent","Signed"];
var contractAr=["لم يبدأ","تجهيز العقد","تم إرسال العقد","تم توقيع العقد"];
var selectedStatus="all";
function stateOf(row){return states.includes(row.status)?row.status:"New"}
function nameOfStatus(s){var i=states.indexOf(s);return i<0?String(s||""):tr(states[i],statesAr[i])}
function savePartial(id,values){
 if(!activeAdmin)return Promise.reject(new Error("unauthorized"));
 var rev=++revision,previous=pending.get(id);
 pending.set(id,{revision:rev,values:Object.assign({},previous?.values||{},values)});rebuild();
 saveNotice(tr("Saving changes…","جاري حفظ التغييرات…"));
 var job=(queues.get(id)||Promise.resolve()).catch(()=>{}).then(()=>updateApplication(id,values));
 queues.set(id,job);
 job.then(()=>{
   if(pending.get(id)?.revision===rev){pending.delete(id);rebuild()}
   if(queues.get(id)===job){queues.delete(id);if(!queues.size)saveNotice(tr("All changes saved","تم حفظ جميع التغييرات"))}
 }).catch(()=>{
   if(pending.get(id)?.revision===rev){pending.delete(id);rebuild();render()}
   if(queues.get(id)===job)queues.delete(id);
   saveNotice(tr("Could not save a change. Check your connection and re-enter the change.","تعذر حفظ أحد التغييرات. تحقق من الاتصال وأعد إدخال التغيير."));
 });
 return job;
}
function normalPhone(v){
 var digits=String(v||"").replace(/[^0-9+]/g,"");
 if(digits.startsWith("00"))digits=digits.slice(2);
 if(digits.startsWith("+"))digits=digits.slice(1);
 if(/^[0-9]{8}$/.test(digits))digits="965"+digits;
 if(!/^[0-9]{8,15}$/.test(digits))return "";
 return digits;
}
function isEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||"").trim())}
function subjectOf(row,status,language){
 var kind=row.type==="Pet show"?(language==="ar"?"تسجيل عرض الحيوانات":"Pet Show Registration"):(language==="ar"?"طلب المشاركة والمساحة":"Space Request");
 return (language==="ar"?"باو بارك 2027 | ":"PawPark 2027 | ")+kind+" | "+(row.id||"")+
 (language==="ar"?" | تحديث الطلب":" | Application Update");
}
function templateOf(row,status,language){
 var isAr=language==="ar",pet=row.type==="Pet show";
 var n=String(row.contact||row.owner||row.brand||"").trim();
 var request=row.id||"";
 var particulars=pet
   ?(isAr?"العرض: ":"Show: ")+(row.show||"")+" \n"+(isAr?"اسم الحيوان: ":"Pet: ")+(row.pet||"")
   :(isAr?"النشاط: ":"Business: ")+(row.brand||"")+"\n"+(isAr?"المساحة المطلوبة: ":"Requested space: ")+(row.space||"")+"\n"+(isAr?"المنطقة المفضلة: ":"Preferred zone: ")+(row.zone||"");
 var introAr="مرحبًا "+(n||"") +"،";
 var introEn="Hello "+(n||"")+",";
 var messageAr={
  "New":"شكرًا لتقديم طلبك للمشاركة في فعالية باو بارك 2027. تم استلام طلبك المبدئي، وسيتواصل معك الفريق بعد المراجعة.",
  "Under Review":"نشكرك على اهتمامك بالمشاركة في باو بارك 2027. نود إبلاغك أن طلبك الآن قيد المراجعة، وسنوافيك بالمستجدات لاحقًا.",
  "Approved":pet?"يسعدنا إبلاغك بالموافقة المبدئية على طلب المشاركة في عرض الحيوانات بفعالية باو بارك 2027. سيتواصل معك الفريق لتأكيد التفاصيل والمتطلبات النهائية.":"يسعدنا إبلاغك بالموافقة المبدئية على طلب مشاركة نشاطك في باو بارك 2027. سيتواصل معك فريقنا لاستكمال تفاصيل المشاركة والعقد. لا تُعد المساحة أو الموقع مؤكدين حتى اكتمال الاتفاقية واعتماد التفاصيل.",
  "Rejected":"نشكرك على اهتمامك بالمشاركة في باو بارك 2027. بعد مراجعة الطلب، نعتذر عن عدم إمكانية قبول المشاركة في هذه الدورة. نقدّر اهتمامك ونتمنى لك التوفيق.",
  "Waitlisted":"شكرًا لاهتمامك بالمشاركة في باو بارك 2027. تم إدراج طلبك في قائمة الانتظار، وسنتواصل معك عند توفر فرصة مناسبة. لا يعني الإدراج تأكيد المشاركة."
 };
 var messageEn={
  "New":"Thank you for applying to take part in PawPark 2027. We have received your request and will contact you after review.",
  "Under Review":"Thank you for your interest in PawPark 2027. Your application is currently under review. We will contact you with updates.",
  "Approved":pet?"We are pleased to inform you that your PawPark 2027 pet show application has received preliminary approval. Our team will contact you to confirm the final details and requirements.":"We are pleased to inform you that your PawPark 2027 space request has received preliminary approval. Our team will contact you regarding participation details and the agreement. The space and final location are not confirmed until the agreement and details are finalized.",
  "Rejected":"Thank you for your interest in PawPark 2027. After reviewing your application, we regret that we cannot offer participation at this event. We appreciate your interest and wish you all the best.",
  "Waitlisted":"Thank you for your interest in PawPark 2027. Your request has been placed on our waiting list, and we will contact you if a suitable opportunity becomes available. This is not a confirmed participation."
 };
 return (isAr?introAr:introEn)+"\n\n"+(isAr?messageAr[status]:messageEn[status])+"\n\n"+
 (isAr?"رقم الطلب: ":"Reference: ")+request+"\n"+particulars+
 "\n\n"+(isAr?"مع التحية،\nفريق باو بارك بالتعاون مع باو أب\ninfo@pawapp.net":"Kind regards,\nPawPark Team in collaboration with PawApp\ninfo@pawapp.net");
}
function contactButtons(parent,row){
 var status=stateOf(row),messageLang=row.messageLang==="en"?"en":"ar";
 var box=put(parent,"section","reply-tools");
 var title=put(box,"div","reply-title");
 put(title,"h4","",tr("Reply to applicant","الرد على مقدم الطلب"));
 put(title,"span","tag",tr("Ready-to-edit draft","رسالة جاهزة للتعديل"));
 var controls=put(box,"div","reply-controls"),langLabel=put(controls,"label","");
 put(langLabel,"span","",tr("Message language","لغة الرسالة"));
 var languageSelect=put(langLabel,"select","");
 [["ar","العربية"],["en","English"]].forEach(function(v){var opt=put(languageSelect,"option","",v[1]);opt.value=v[0]});
 languageSelect.value=messageLang;
 var reset=put(controls,"button","btn small",tr("Reset template","استعادة النص الافتراضي"));
 reset.type="button";
 var subjectBox=put(box,"div","subject");
 var text=put(box,"textarea","");
 text.maxLength=10000;
 text.setAttribute("aria-label",tr("Editable reply message","نص الرسالة قابل للتعديل"));
 text.dir=messageLang==="ar"?"rtl":"ltr";
 var validDraft=row.draftStatus===status&&row.draftLanguage===messageLang;
 text.value=validDraft&&row.draftMessage!==undefined?row.draftMessage:templateOf(row,status,messageLang);
 var subject=subjectOf(row,status,messageLang);
 subjectBox.textContent=tr("Subject: ","الموضوع: ")+subject;
 var actions=put(box,"div","actions");
 var call=put(actions,"a","btn alt",tr("☎ Call","☎ اتصال"));call.href=phoneHref(row.phone);
 var email=put(actions,"a","btn email",tr("✉ Email draft","✉ رسالة إيميل"));
 var wa=put(actions,"a","btn whatsapp",tr("💬 WhatsApp draft","💬 رسالة واتساب"));
 var copy=put(actions,"button","btn copy",tr("Copy message","نسخ الرسالة"));copy.type="button";
 function sync(){
   var body=text.value;
   var address=String(row.email||"").trim();
   if(isEmail(address)){email.href="mailto:"+encodeURIComponent(address)+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(body);email.removeAttribute("aria-disabled");email.removeAttribute("tabindex");}
   else {email.removeAttribute("href");email.setAttribute("aria-disabled","true");email.setAttribute("tabindex","-1");}
   var phone=normalPhone(row.phone);
   if(phone){wa.href="https://wa.me/"+phone+"?text="+encodeURIComponent(body);wa.target="_blank";wa.rel="noopener noreferrer";wa.removeAttribute("aria-disabled");wa.removeAttribute("tabindex");}
   else{wa.removeAttribute("href");wa.setAttribute("aria-disabled","true");wa.setAttribute("tabindex","-1");}
 }
 sync();
 text.addEventListener("input",function(){savePartial(row.id,{draftMessage:text.value,draftStatus:status,draftLanguage:messageLang,messageLang:messageLang});sync()});
 languageSelect.addEventListener("change",function(){messageLang=languageSelect.value;text.dir=messageLang==="ar"?"rtl":"ltr";text.value=templateOf(row,status,messageLang);subject=subjectOf(row,status,messageLang);subjectBox.textContent=tr("Subject: ","الموضوع: ")+subject;savePartial(row.id,{messageLang:messageLang,draftMessage:text.value,draftStatus:status,draftLanguage:messageLang});sync()});
 reset.addEventListener("click",function(){text.value=templateOf(row,status,messageLang);savePartial(row.id,{draftMessage:text.value,draftStatus:status,draftLanguage:messageLang});sync()});
 copy.addEventListener("click",function(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text.value).then(function(){copy.textContent=tr("Copied","تم النسخ")}).catch(function(){text.select()})}else{text.select()}});
 var hint=put(box,"p","advice",tr("Email and WhatsApp open an editable draft. You must press Send inside that app. Opening a draft does not prove it was delivered.","الإيميل والواتساب يفتحون رسالة جاهزة قابلة للتعديل. إنتِ تضغطين إرسال داخل التطبيق؛ فتح الرسالة لا يعني أنها انرسلت."));
 if(!isEmail(row.email)||!normalPhone(row.phone))put(box,"p","advice warn",tr("A missing or invalid email/phone disables that channel.","إذا الإيميل أو الرقم غير صحيح راح يتعطل زر القناة المعنية."));
 var lifecycle=put(box,"div","lifecycle");
 var mark=put(lifecycle,"button","btn small",row.contactedAt?tr("Contact recorded ✓","تم تسجيل التواصل ✓"):tr("Mark as contacted (manually)","تسجيل التواصل يدويًا"));
 mark.type="button";
 mark.addEventListener("click",function(){var at=new Date().toISOString();savePartial(row.id,{contactedAt:at});mark.textContent=tr("Contact recorded ✓","تم تسجيل التواصل ✓")});
 put(lifecycle,"div","save-note",row.contactedAt?tr("Contact marked manually: ","تم تسجيل التواصل يدويًا: ")+new Date(row.contactedAt).toLocaleString(lang==="ar"?"ar-KW":"en-GB"):tr("Only click after you have actually contacted the applicant. This does not confirm delivery.","اضغطي بعد ما تتواصلين فعليًا مع العميل. هذا لا يؤكد وصول الرسالة."));
}

function newCard(container,row,idx){var card=put(container,"article","request"),head=put(card,"div","request-head"),name=put(head,"div","");
put(name,"h3","",row.brand||row.owner||tr("Unnamed request","طلب بدون اسم"));
var date="";try{date=row.date?new Date(row.date).toLocaleString(lang==="ar"?"ar-KW":"en-GB"):""}catch(e){}
put(name,"div","meta",(row.id||"DEMO")+" · "+date+" · "+(row.type==="Pet show"?tr("Pet show","عرض حيوانات"):tr("Book Your Space","طلب مساحة")));
put(head,"span","tag",nameOfStatus(stateOf(row))+"");
var data=put(card,"div","fields");
if(row.type==="Space request"){
itemField(data,"Contact person","اسم المسؤول",row.contact);itemField(data,"Mobile / WhatsApp","رقم الهاتف",row.phone);
itemField(data,"Email","البريد الإلكتروني",row.email);itemField(data,"Space","المساحة",row.space);
itemField(data,"Zone","المنطقة",row.zone);itemField(data,"Custom requirements","متطلبات خاصة",row.custom);
}else{
itemField(data,"Pet owner","اسم المالك",row.owner);itemField(data,"Mobile","رقم الهاتف",row.phone);
itemField(data,"Email","البريد الإلكتروني",row.email);itemField(data,"Show","نوع العرض",row.show);
itemField(data,"Pet's name","اسم الحيوان",row.pet);itemField(data,"Pet type","نوع الحيوان",row.species);
itemField(data,"Breed","السلالة",row.breed);itemField(data,"Age","العمر",row.age);
}
var manage=put(card,"div","manage"),sw=put(manage,"label","status-wrap");
put(sw,"span","",tr("Status","الحالة"));
var select=put(sw,"select","");
