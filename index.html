<body>

<header class="top"><div class="container top-inner">

<main>
<section class="hero" id="home"><div class="container hero-layout">
<div class="hero-copy"><div class="eyebrow" data-en="WHERE FAMILIES, PETS & BUSINESSES COME TOGETHER" data-ar="حيث تجتمع العائلات والحيوانات الأليفة والأعمال"></div>
<h1><span data-en="PAWPARK" data-ar="باو بارك"></span><br><span data-en="EVENT 2027" data-ar="٢٠٢٧"></span></h1>
<p class="sub" data-en="PawPark in collaboration with PawApp" data-ar="باو بارك بالتعاون مع باو أب"></p>
<div class="event-line"><span class="emoji">🗓</span><span data-en="21–23 January 2027 · 12 PM–11 PM" data-ar="٢١–٢٣ يناير ٢٠٢٧ · ١٢ ظهرًا – ١١ مساءً"></span></div>
<div class="event-line"><span class="emoji">📍</span><span data-en="Shuwaikh Park (Al-Sadaqa Wal-Salam Park), Kuwait" data-ar="حديقة الصداقة والسلام – منطقة الشويخ، الكويت"></span></div>
<div class="hero-actions"><small data-en="FOR BUSINESSES & BRANDS" data-ar="للمشاريع والعلامات التجارية"></small><a class="btn white" href="#book" data-en="BOOK YOUR SPACE" data-ar="احجز مساحتك"></a><small data-en="FOR PET OWNERS & PARTICIPANTS" data-ar="لأصحاب الحيوانات والمشاركين"></small><a class="btn beige" href="#petshow" data-en="JOIN A PET SHOW" data-ar="شارك في عرض الحيوانات"></a></div>
</div>
<div class="hero-img"><div class="media has-photo"><img class="photo" src="assets/hero-pomeranian.jpg" alt="Pomeranian wearing pink outfit at PawPark" fetchpriority="high" decoding="async" width="964" height="767"></div></div>
</div></section>
<section class="zones" id="zones"><div class="container"><h2 class="heading title-band"><span class="band" data-en="EXPLORE" data-ar="اكتشف"></span> <span data-en="OUR ZONES" data-ar="مناطقنا"></span></h2>

<button type="button" class="zone" data-zone="Kids Zone"><div class="media has-photo"><img class="photo" src="assets/kids-zone.jpg" alt="Children enjoying face painting at PawPark" loading="lazy" decoding="async" width="1010" height="766"></div><h3 data-en="KIDS ZONE" data-ar="منطقة الأطفال"></h3></button>
<button type="button" class="zone" data-zone="Pets Zone"><div class="media has-photo"><img class="photo" src="assets/pets-zone.jpg" alt="Paw sculpture and Dalmatian at PawPark" loading="lazy" decoding="async" width="864" height="1536"></div><h3 data-en="PETS ZONE" data-ar="منطقة الحيوانات"></h3></button>
<button type="button" class="zone" data-zone="Food & Beverages"><div class="media has-photo"><img class="photo" src="assets/food-zone.jpg" alt="Girl enjoying food at PawPark" loading="lazy" decoding="async" width="964" height="767"></div><h3 data-en="FOOD & BEVERAGE ZONE" data-ar="منطقة المأكولات والمشروبات"></h3></button>

<section class="booking" id="book"><div class="container">

<div class="book-grid">
<div class="book-photos"><div class="media has-photo"><img class="photo" src="assets/booking-collage.jpg" alt="Families and large dogs enjoying the park" loading="lazy" decoding="async" width="1148" height="767"></div><div class="media has-photo"><img class="photo" src="assets/booking-collage.jpg" alt="Children holding small dogs at PawPark" loading="lazy" decoding="async" width="1148" height="767"></div></div>

<div class="field"><label for="contactPerson" data-en="Contact Person *" data-ar="اسم مسؤول التواصل *"></label><input id="contactPerson" required maxlength="100"></div>
<div class="field"><label for="phone" data-en="Phone / WhatsApp *" data-ar="رقم الهاتف / واتساب *"></label><input id="phone" type="tel" inputmode="tel" required autocomplete="tel" dir="ltr"></div>
<div class="field"><label for="email" data-en="Email Address *" data-ar="البريد الإلكتروني *"></label><input id="email" type="email" required autocomplete="email" dir="ltr"></div>
<div class="field"><label class="legend" data-en="Choose Your Space Size *" data-ar="اختَر حجم المساحة *"></label><div class="sizes">
<button class="size" type="button" data-size="3 × 3 m" aria-pressed="false" data-en="SMALL · 3×3" data-ar="صغير · ٣×٣"></button>
<button class="size" type="button" data-size="3 × 4 m" aria-pressed="false" data-en="MEDIUM · 3×4" data-ar="متوسط · ٣×٤"></button>
<button class="size" type="button" data-size="Custom" aria-pressed="false" data-en="CUSTOM" data-ar="مقاس خاص"></button></div></div>

<div class="field"><label for="zone" data-en="Preferred Zone *" data-ar="المنطقة المفضلة *"></label><select id="zone" required>
<option value="" data-en="Choose a zone" data-ar="اختَر منطقة"></option><option value="Kids Zone" data-en="Kids Zone" data-ar="منطقة الأطفال"></option><option value="Pets Zone" data-en="Pets Zone" data-ar="منطقة الحيوانات"></option><option value="Food & Beverages" data-en="Food & Beverages" data-ar="المأكولات والمشروبات"></option><option value="Trucks" data-en="Trucks (request form only)" data-ar="العربات (في النموذج فقط)"></option></select></div>
<p class="notice" data-en="No payment now. This is a request, not a confirmed reservation." data-ar="لا يوجد دفع الآن. هذا طلب مبدئي وليس حجزًا مؤكدًا."></p><p class="error" id="spaceErr" aria-live="polite"></p>
<button type="submit" class="btn primary" style="width:100%" data-en="SUBMIT SPACE REQUEST" data-ar="إرسال طلب المساحة"></button>

</div></div></section>

<section class="contact" id="contact"><div class="container contact-grid"><div><h2 class="heading"><span class="band" data-en="CONTACT US" data-ar="تواصل معانا"></span></h2><div class="contact-card"><a href="tel:+96541117003">☎ 41117003</a><a href="mailto:info@pawapp.net">✉ info@pawapp.net</a></div></div><div class="media has-photo contact-img"><img class="photo" src="assets/contact-dog.jpg" alt="Happy brown dog at PawPark contact section" loading="lazy" decoding="async" width="803" height="768"></div></div></section>
</main><footer class="footer"><p><strong data-en="PAWPARK 2027 · IN COLLABORATION WITH PAWAPP" data-ar="باو بارك ٢٠٢٧ · بالتعاون مع باو أب"></strong></p><p data-en="Design preview — bookings are not yet sent to organizers." data-ar="معاينة التصميم — طلبات الحجز لا تُرسل للمنظمين حاليًا."></p></footer>
<script>
(function(){
"use strict";
var lang="en",chosenSize="",lastReceipts={};var $=function(id){return document.getElementById(id)};
var tr=function(en,ar){return lang==="ar"?ar:en};
var val=function(id){return ($(id).value||"").trim()};
var entries=function(sel){return Array.from(document.querySelectorAll(sel))};
function updateLanguage(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
$("lang").textContent=lang==="ar"?"ENGLISH":"العربية";
entries("[data-en][data-ar]").forEach(function(el){el.textContent=el.getAttribute("data-"+lang)});
document.title=tr("PawPark 2027 — Book Your Space","باو بارك ٢٠٢٧ — احجز مساحتك");
Object.keys(lastReceipts).forEach(function(target){var item=lastReceipts[target];if(item)receipt(item.id,item.obj,target)});
}
$("lang").addEventListener("click",function(){lang=lang==="en"?"ar":"en";updateLanguage()});
entries("[data-size]").forEach(function(el){el.addEventListener("click",function(){chosenSize=el.dataset.size;entries("[data-size]").forEach(function(n){n.classList.toggle("active",n.dataset.size===chosenSize);n.setAttribute("aria-pressed",String(n.dataset.size===chosenSize))});$("customBox").classList.toggle("hidden",chosenSize!=="Custom")})});
entries(".zone").forEach(function(el){el.addEventListener("click",function(){$("zone").value=el.dataset.zone;document.getElementById("book").scrollIntoView({behavior:"smooth"});setTimeout(function(){$("zone").focus({preventScroll:true})},250)})});
function put(key,obj){var a=[];try{a=JSON.parse(localStorage.getItem("pawpark_demo_requests")||"[]");if(!Array.isArray(a))a=[]}catch(e){}a.unshift(Object.assign({id:"DEMO-"+Date.now().toString(36).toUpperCase(),date:new Date().toISOString(),type:key,status:"Demo - not submitted"},obj));localStorage.setItem("pawpark_demo_requests",JSON.stringify(a.slice(0,200)));return a[0]}
function receipt(id,obj,target){
 lastReceipts[target]={id:id,obj:obj};
 var root=$(target);root.classList.remove("hidden");root.replaceChildren();
 function putText(tag,cls,value,parent){var e=document.createElement(tag);e.className=cls;e.textContent=value;(parent||root).appendChild(e);return e}
 putText("div","confirm-icon","🐾");
 putText("h3","confirm-heading",tr("Your test request has been recorded!","تم تسجيل طلبك التجريبي!"));
 putText("p","confirm-lead",tr("Thank you for your interest in PawPark 2027.","شكرًا لاهتمامك بالمشاركة في باو بارك ٢٠٢٧."));
 var ref=putText("div","confirm-reference","");
 putText("span","confirm-ref-label",tr("Test reference number","رقم الطلب التجريبي"),ref);
 putText("strong","confirm-ref-number",id,ref);
 putText("span","confirm-status",tr("Preview status: Pending Review","حالة تجريبية: قيد المراجعة"),ref);
 var party=obj.brand||obj.owner||"";
 var choice=obj.space||obj.show||"";
 var zone=obj.zone?(tr(" · Preferred zone: "," · المنطقة المفضلة: ")+obj.zone):"";
 putText("p","confirm-detail",tr("Request: ","الطلب: ")+party+" — "+choice+zone);
 putText("p","confirm-note",tr("Once real submissions are enabled, the PawPark team will review your request and contact you with the next steps as soon as possible.","بعد تفعيل استقبال الطلبات الحقيقي، يراجع فريق باو بارك طلبك ويتواصل معاك بأقرب وقت بخصوص الخطوات القادمة."));
 putText("p","confirm-demo",tr("TEST ONLY — this request was not sent to PawPark. It is saved on this browser only and cannot be seen on other devices.","تجربة فقط — هذا الطلب ما وصل لفريق باو بارك. محفوظ على هالمتصفح فقط وما يظهر على الأجهزة الثانية."));
 if(new URLSearchParams(location.search).get("admin_demo")==="1"){var link=document.createElement("a");link.href="admin.html";link.className="btn beige";link.textContent=tr("OPEN ADMIN DEMO ON THIS DEVICE","افتح معاينة لوحة الإدارة على نفس الجهاز");root.appendChild(link)}
}
function validEmail(x){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)}function validPhone(x){return x.replace(/\D/g,"").length>=7}
$("spaceForm").addEventListener("submit",function(e){e.preventDefault();var o={brand:val("brand"),contact:val("contactPerson"),phone:val("phone"),email:val("email"),space:chosenSize,zone:val("zone"),custom:val("custom")};if(!o.brand||!o.contact||!o.phone||!o.email||!o.space||!o.zone||!validEmail(o.email)||!validPhone(o.phone)||(o.space==="Custom"&&!o.custom)){$("spaceErr").textContent=tr("Please enter your details, a valid phone and email, and choose a space and zone.","يرجى تعبئة البيانات ورقم وإيميل صحيحين واختيار المقاس والمنطقة.");return}$("spaceErr").textContent="";var r=put("Space request",o);receipt(r.id,o,"spaceResult");$("spaceResult").scrollIntoView({behavior:"smooth",block:"nearest"})});
$("petForm").addEventListener("submit",function(e){e.preventDefault();var o={show:val("show"),owner:val("owner"),phone:val("petPhone"),email:val("petEmail"),pet:val("petName"),species:val("species"),breed:val("breed"),age:val("age")};if(!o.show||!o.owner||!o.phone||!o.pet||!o.species||!validPhone(o.phone)||(o.email&&!validEmail(o.email))){$("petErr").textContent=tr("Complete the required fields and check the phone/email.","عبّئ الحقول المطلوبة وتأكد من الرقم والإيميل.");return}$("petErr").textContent="";var r=put("Pet show",o);receipt(r.id,o,"petResult");$("petResult").scrollIntoView({behavior:"smooth",block:"nearest"})});
updateLanguage();
})();
</script>
</body></html>
