(function(){

var lang="en",chosenSize="";var $=function(id){return document.getElementById(id)};

var entries=function(sel){return Array.from(document.querySelectorAll(sel))};
function updateLanguage(){
document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";
$("lang").textContent=lang==="ar"?"ENGLISH":"العربية";
entries("[data-en][data-ar]").forEach(function(el){el.textContent=el.getAttribute("data-"+lang)});
document.title=tr("PawPark 2027 — Book Your Space","باو بارك ٢٠٢٧ — احجز مساحتك");

function validEmail(x){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x)}function validPhone(x){return x.replace(/\D/g,"").length>=7}
